name: Download count

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-count
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Update combined Modrinth count
        run: python3 .github/scripts/update_downloads.py
      - name: Save badge
        run: |
          if git diff --quiet -- .github/badges/modrinth.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/modrinth.svg
          git commit -m "Update Modrinth downloads"
          git push
